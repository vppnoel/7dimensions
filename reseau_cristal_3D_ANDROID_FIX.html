
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réseau 3D Cristal – FIX OrbitControls</title>
<style>
  body { margin:0; overflow:hidden; background:black; }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #00ffcc;
    font-family: monospace;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 6px;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="info">
<b>Réseau 3D Cristal</b><br>
Android / Chrome compatible<br>
1 doigt : rotation<br>
2 doigts : zoom
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js";

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const d = new THREE.DirectionalLight(0xffffff, 1);
d.position.set(10,20,10);
scene.add(d);

// Axes (visual proof)
scene.add(new THREE.AxesHelper(5));

// Crystal points
const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
const matBig = new THREE.MeshStandardMaterial({ color: 0xffffff });
const gSmall = new THREE.SphereGeometry(0.12, 16, 16);
const gBig = new THREE.SphereGeometry(0.25, 20, 20);

const group = new THREE.Group();

for (let T=-4; T<=2; T++) {
  for (let L=-1; L<=4; L++) {
    for (let M=-2; M<=2; M++) {
      const big = (T===0 || L===0 || M===0);
      const mesh = new THREE.Mesh(big ? gBig : gSmall, big ? matBig : mat);
      mesh.position.set(T,L,M);
      group.add(mesh);
    }
  }
}

scene.add(group);

// Auto-frame camera
const box = new THREE.Box3().setFromObject(group);
const size = box.getSize(new THREE.Vector3()).length();
const center = box.getCenter(new THREE.Vector3());

controls.target.copy(center);
camera.position.copy(center);
camera.position.x += size * 0.8;
camera.position.y += size * 0.8;
camera.position.z += size * 0.8;
camera.lookAt(center);

// Resize
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
