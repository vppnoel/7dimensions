
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réseau 3D Cristal – T L M</title>
<style>
  body { margin: 0; overflow: hidden; }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.65);
    color: white;
    padding: 10px 14px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    border-radius: 6px;
    z-index: 10;
  }
</style>
</head>
<body>

<div id="info">
<b>Réseau 3D cristal</b><br>
T → droite<br>
L ↑ haut<br>
M → arrière<br>
(1 doigt : rotation · 2 doigts : zoom)
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

// Camera — closer and centered
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(8, 8, 8);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,0,0);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(10, 20, 10);
scene.add(light);

// Materials
const matNormal = new THREE.MeshStandardMaterial({ color: 0x1565c0 });
const matHighlight = new THREE.MeshStandardMaterial({ color: 0x1565c0 });

// Geometries
const geoSmall = new THREE.SphereGeometry(0.12, 16, 16);
const geoBig   = new THREE.SphereGeometry(0.22, 20, 20);

// Points
for (let T=-4; T<=2; T++) {
  for (let L=-1; L<=4; L++) {
    for (let M=-2; M<=2; M++) {
      const isCenter = (T===0 || L===0 || M===0);
      const mesh = new THREE.Mesh(isCenter ? geoBig : geoSmall, isCenter ? matHighlight : matNormal);
      mesh.position.set(T, L, M);
      scene.add(mesh);
    }
  }
}

// Axes
const axisMat = new THREE.LineBasicMaterial({ color: 0x000000 });

function drawAxis(a,b) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
  scene.add(new THREE.Line(g, axisMat));
}

drawAxis([-4,0,0],[2,0,0]);   // T
drawAxis([0,-1,0],[0,4,0]);   // L
drawAxis([0,0,-2],[0,0,2]);   // M

// Planes
const planeMat = new THREE.MeshStandardMaterial({
  color: 0x999999,
  transparent: true,
  opacity: 0.18,
  side: THREE.DoubleSide
});

// T=0
const pT = new THREE.Mesh(new THREE.PlaneGeometry(6,6), planeMat);
pT.rotation.y = Math.PI/2;
scene.add(pT);

// L=0
const pL = new THREE.Mesh(new THREE.PlaneGeometry(6,6), planeMat);
pL.rotation.x = Math.PI/2;
scene.add(pL);

// M=0
const pM = new THREE.Mesh(new THREE.PlaneGeometry(6,6), planeMat);
scene.add(pM);

// Resize
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
