
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagnostic Réseau 3D – Cristal</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    color: #00ffcc;
    padding: 10px 14px;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    z-index: 10;
    max-width: 90%;
  }
</style>
</head>
<body>

<div id="info">
<b>Diagnostic Three.js</b><br>
Si tu vois UNIQUEMENT ce texte → problème JS / CDN<br>
Sinon → la scène DOIT être visible.
</div>

<script>
function fail(msg){
  document.getElementById("info").innerHTML += "<br><span style='color:red'>ERREUR : "+msg+"</span>";
}
window.addEventListener("error", function(e){
  fail(e.message || "erreur JS inconnue");
});
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

console.log("Three.js version:", THREE.REVISION);

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const d = new THREE.DirectionalLight(0xffffff, 1);
d.position.set(10,20,10);
scene.add(d);

// Helpers (MUST be visible)
scene.add(new THREE.AxesHelper(5));
scene.add(new THREE.GridHelper(10,10,0x444444,0x222222));

// Crystal points
const mat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
const matBig = new THREE.MeshStandardMaterial({ color: 0xffffff });
const gSmall = new THREE.SphereGeometry(0.12, 16, 16);
const gBig = new THREE.SphereGeometry(0.25, 20, 20);

const group = new THREE.Group();

for (let T=-4; T<=2; T++) {
  for (let L=-1; L<=4; L++) {
    for (let M=-2; M<=2; M++) {
      const big = (T===0 || L===0 || M===0);
      const mesh = new THREE.Mesh(big ? gBig : gSmall, big ? matBig : mat);
      mesh.position.set(T,L,M);
      group.add(mesh);
    }
  }
}

scene.add(group);

// Auto-scale camera
const box = new THREE.Box3().setFromObject(group);
const size = box.getSize(new THREE.Vector3()).length();
const center = box.getCenter(new THREE.Vector3());

controls.target.copy(center);
camera.position.copy(center);
camera.position.x += size * 0.7;
camera.position.y += size * 0.7;
camera.position.z += size * 0.7;
camera.lookAt(center);

// Resize
window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

document.getElementById("info").innerHTML += "<br><span style='color:#00ff00'>THREE chargé ✔</span>";
</script>

</body>
</html>
